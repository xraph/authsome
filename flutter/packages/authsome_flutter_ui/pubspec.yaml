name: authsome_flutter_ui
description: Pre-built Material Design 3 authentication UI widgets for AuthSome.
version: 1.6.1
homepage: https://github.com/xraph/authsome
repository: https://github.com/xraph/authsome/tree/main/flutter/packages/authsome_flutter_ui
issue_tracker: https://github.com/xraph/authsome/issues

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  authsome_flutter: ^1.6.1
  # Web-only bindings for the Turnstile captcha and SSO redirects. Safe to
  # depend on cross-platform: the code that imports it is only compiled
  # into Web builds (see lib/src/platform/).
  web: ^1.1.0

dev_dependencies:
  http: ^1.6.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
