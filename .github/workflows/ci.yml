name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  go:
    name: Go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.7"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify module tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-go${{ matrix.go-version }}
          path: coverage.out
          retention-days: 7

  # ─── Store Conformance (Postgres + Mongo) ───────────────────────────
  # Runs the cross-backend store conformance suite against real Postgres
  # (testcontainers) and MongoDB (single-node replica set, so app/org cascade
  # transactions work). Scoped to `-run TestConformance` so it does NOT run the
  # older per-backend store_test.go suites, which have pre-existing failures
  # (postgres users.env_id FK) and a hanging mongo migration-lock test that are
  # tracked separately.
  #
  # This job is ADVISORY (continue-on-error): the *blocking* cross-backend
  # coverage is memory + sqlite, which the main `go` job runs on every push
  # without Docker. Postgres/Mongo run here for visibility; promote to blocking
  # once the pre-existing per-backend failures above are resolved.
  integration:
    name: Store Conformance (pg + mongo)
    runs-on: ubuntu-latest
    needs: go
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          echo "Waiting for mongod..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          echo "Waiting for primary..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 2
          done

      - name: Run store conformance suite
        env:
          AUTHSOME_MONGO_URI: mongodb://localhost:27017/authsome_test?replicaSet=rs0&directConnection=true
        run: go test -tags integration -run 'TestConformance$' -count=1 -timeout 12m ./store/...

  # ─── Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 10m

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/authsome .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── SDK Generation ──────────────────────────────────────────────
  sdkgen:
    name: SDK Generation
    runs-on: ubuntu-latest
    needs: go

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SDKs
        run: make -C sdkgen generate SDK_OUT=../sdk SDK_PLUGINS=social,mfa,apikey,magiclink,sso

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: authsome-sdk
          path: sdk/
          retention-days: 14

  # ─── JS/TypeScript ──────────────────────────────────────────────────
  js:
    name: JS/TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: cd ui && pnpm install --frozen-lockfile

      - name: Build
        run: cd ui && pnpm run build

      - name: Typecheck
        run: cd ui && pnpm run typecheck

      - name: Build SDK TypeScript
        run: |
          cd sdk/typescript
          npm install
          npm run build

  # ─── Flutter ────────────────────────────────────────────────────────
  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies (workspace)
        run: cd flutter && flutter pub get

      - name: Analyze (workspace)
        run: cd flutter && flutter analyze --no-fatal-infos
