name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required by go-ci.yml's gosec SARIF upload
  security-events: write

jobs:
  # ─── Go Build & Test ────────────────────────────────────────────────
  # test, lint, verify and security now come from the shared workflow. It
  # probes for Makefile targets per step and falls back to the plain go
  # commands these jobs used to run inline.
  ci:
    uses: xraph/workflows/.github/workflows/go-ci.yml@v1
    with:
      # Deliberately a bare minor. The matrix job name embeds this string and the
      # branch ruleset requires "ci / Test (ubuntu-latest, go1.26)", so pinning a
      # patch here renames the job and that check can never report. The shared
      # workflow sets check-latest, so this still resolves to the newest patch.
      go-versions: '["1.26"]'
      os: '["ubuntu-latest"]'

  # ─── Store Conformance (Postgres + Mongo) ───────────────────────────
  # Runs the cross-backend store conformance suite against real Postgres
  # (testcontainers) and MongoDB (single-node replica set, so app/org cascade
  # transactions work). The -run filter below is what stops this job also
  # running the older per-backend store_test.go suites, which now pass on
  # postgres since env_id is seeded.
  #
  # That filter used to be justified here by the claim that the mongo suite
  # contains a hanging migration-lock test, TestMigrate_DoesNotBreakFreshLock.
  # It does not hang. Measured against a single-node rs0 replica set matching
  # this job's own service, it passes in 11 to 12 seconds over four runs,
  # waiting out the migration lock-acquire retry rather than blocking on it.
  # The claim was stale and cost at least one person time chasing a hang that
  # was not there.
  #
  # What that correction does not settle is whether the rest of the
  # integration-tagged tests belong in this job. There are 96 of them, this
  # pattern matches 7, and the remaining 89 are built by nothing and run by
  # nothing. That is a real question with a real cost either way, and it wants
  # deciding rather than inheriting. If you widen the filter, run them as a set
  # against main first, because the last count taken of them was taken against
  # a stale tree and was wrong.
  #
  # BLOCKING: all four backends (memory + sqlite from the `go` job, and
  # postgres + mongo here) must pass the same store contract, so behavioral
  # drift between implementations fails CI rather than shipping.
  #
  # The path covers ./plugins/... as well as ./store/..., because plugins ship
  # their own four-backend stores and drift between those is the same class of
  # bug. Packages with no matching test simply match nothing.
  #
  # The -run pattern matches three prefixes, and adding a fourth name to it
  # is a smell: prefer naming a new test to fit one of these.
  #
  #   TestConformance         the cross-backend store contract suites
  #   TestStoreConformance_   plugins/agentauth, which predates that name and
  #                           whose postgres and mongo halves were, before
  #                           this pattern, built by nothing and run by
  #                           nothing while looking like coverage
  #   TestMigration_          integration tests for a single migration, where
  #                           the thing under test is what the migration does
  #                           to data that is already there
  #
  # A check that runs zero tests is indistinguishable from a check that
  # passes, so anything integration-tagged that this pattern does not match
  # is dead weight in the tree.
  #
  # -p 1 is load-bearing. Every package here shares the one mongo database
  # this job starts, and at least one drops it during teardown, so running
  # package binaries concurrently produced "database is in the process of
  # being dropped" and IX lock timeouts in roughly one run in three. It did
  # not bite while the path was ./store/... alone, because store/mongo was
  # the only package touching mongo.
  integration:
    name: Store Conformance (pg + mongo)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          echo "Waiting for mongod..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          echo "Waiting for primary..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then break; fi
            sleep 2
          done

      - name: Run store conformance suite
        env:
          AUTHSOME_MONGO_URI: mongodb://localhost:27017/authsome_test?replicaSet=rs0&directConnection=true
        run: go test -tags integration -p 1 -run '^TestConformance$|^TestStoreConformance_|^TestMigration_' -count=1 -timeout 15m ./store/... ./plugins/...

  # ─── Lint ───────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 10m

  # ─── Format Check ──────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (goimports)
        run: |
          OUTPUT=$(goimports -l -local github.com/xraph/authsome .)
          if [ -n "$OUTPUT" ]; then
            echo "::error::The following files need goimports formatting:"
            echo "$OUTPUT"
            exit 1
          fi

  # ─── SDK Generation ──────────────────────────────────────────────
  sdkgen:
    name: SDK Generation
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SDKs
        run: make -C sdkgen generate SDK_OUT=../sdk

      # The same generator also emits embedded-mode clients into the ui and
      # flutter packages. Those were left out of the check below when it was
      # first written, and drifted roughly three months behind the routes as a
      # result — long enough that catching up meant a breaking change to both
      # packages rather than a regeneration. They are generated and compared
      # here for the same reason the standalone SDKs are.
      - name: Generate embedded clients
        run: |
          make -C sdkgen generate-ui-core
          make -C sdkgen generate-flutter-core

      # The steps above regenerate into the working tree. Until this check
      # existed nothing compared the result against what is committed, so a
      # change to a route or a request struct could ship without spec.json or
      # the SDKs ever catching up, and the job still went green. That is how
      # the SSO connection_id field reached main described nowhere in the spec.
      - name: Check the committed SDKs match the generated ones
        run: |
          paths="sdk/ sdkgen/spec.json ui/packages/core/src/generated flutter/packages/authsome_core/lib/src/generated"
          if ! git diff --quiet -- $paths; then
            echo "::error::Generated SDKs differ from what is committed. Run: make -C sdkgen generate SDK_OUT=../sdk && make -C sdkgen generate-ui-core && make -C sdkgen generate-flutter-core"
            git diff --stat -- $paths
            git diff -- sdkgen/spec.json | head -200
            exit 1
          fi
          echo "Committed SDKs are up to date."

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: authsome-sdk
          path: sdk/
          retention-days: 14

  # ─── JS/TypeScript ──────────────────────────────────────────────────
  js:
    name: JS/TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: cd ui && pnpm install --frozen-lockfile

      - name: Build
        run: cd ui && pnpm run build

      - name: Typecheck
        run: cd ui && pnpm run typecheck

      - name: Build SDK TypeScript
        run: |
          cd sdk/typescript
          npm install
          npm run build

      - name: Test SDK TypeScript
        run: cd sdk/typescript && npm test

  # ─── Flutter ────────────────────────────────────────────────────────
  flutter:
    name: Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies (workspace)
        run: cd flutter && flutter pub get

      - name: Analyze (workspace)
        run: cd flutter && flutter analyze --no-fatal-infos

      - name: Test SDK Dart
        run: cd sdk/dart && dart pub get && dart test
