<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Authsome</title>
  <desc id="desc">Authsome is a plugin-driven authentication and identity engine for Go: users, sessions, organizations and RBAC in the core, with passwords, social login, magic links, passkeys, MFA, SSO and more as plugins.</desc>
